name: Build Windows EXE

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish. Leave empty to build an artifact only.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: windows-release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm ci
      - name: Verify
        run: |
          npm run typecheck
          npm test
      - name: Build
        run: npm run tauri build
      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: studyflow-portable
          path: src-tauri/target/release/studyflow.exe
      - name: Publish Windows executable to Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item src-tauri/target/release/studyflow.exe StudyFlow-Windows-x64.exe
          gh release view $env:RELEASE_TAG --repo $env:GH_REPO *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG StudyFlow-Windows-x64.exe --repo $env:GH_REPO --clobber
          } else {
            gh release create $env:RELEASE_TAG StudyFlow-Windows-x64.exe --repo $env:GH_REPO --verify-tag --title $env:RELEASE_TAG --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
