name: Build Installers (EXE + APK)

# 推送 v* 标签（如 v0.2.0）时云端构建 Windows EXE 与 Android APK，并发布到 GitHub Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm ci
      - name: Build NSIS installer
        run: npm run tauri build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/studyflow.exe

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # sdkmanager（cmdline-tools 16+）需要 Java 17+，必须先于 setup-android 设置
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Accept SDK licenses & install NDK/platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          for i in 1 2 3; do
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973" "platforms;android-34" "build-tools;34.0.0" && break
            echo "sdkmanager retry $i"; sleep 15
          done
          test -d "$ANDROID_HOME/ndk/27.0.12077973" || exit 1
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
      - name: Install dependencies
        run: npm ci
      - name: Init Android project (if gen/ absent)
        run: npm run tauri android init
      - name: Build debug APK
        run: |
          set -o pipefail
          npm run tauri android build -- --apk 2>&1 | tee /tmp/apk-build.log
      - name: Print build log tail on failure
        if: failure()
        run: tail -n 80 /tmp/apk-build.log >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  release:
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release/windows
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release/android
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/windows/*.exe
            release/android/**/*.apk
          body: |
            知行 StudyFlow 安装包（由 GitHub Actions 云端构建）

            - Windows：NSIS setup.exe（安装后离线运行，数据在本机 SQLite）
            - Android：debug APK（可直接安装测试；正式分发请自配签名密钥）

            说明：三端数据各自独立保存，不支持自动跨端同步；可用 JSON 导出/导入手动迁移。
          draft: false
          prerelease: false
