[package]
name = "studyflow"
version = "0.1.0"
description = "知行 StudyFlow — 把终点变成今天的一小步（本地离线学习目标管理）"
authors = ["StudyFlow"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "studyflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
